logging:
  level:
    web: debug
  pattern:
    console: "%clr(%5p) %msg%n"
spring:
  application:
    name: backend
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:kaindet}
    username: ${POSTGRES_USER:kaindet}
    password: ${POSTGRES_PASSWORD:kaindet_dev}
  main:
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
